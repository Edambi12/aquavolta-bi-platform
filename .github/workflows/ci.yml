name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (type-check, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # Non-secret placeholders: the build only inlines these values and never
      # contacts Supabase. No production credential is needed or used.
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
      VITE_SUPABASE_PROJECT_ID: placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  analytics:
    name: Analytics (notebook validation, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics/requirements-dev.txt

      - name: Validate notebooks (JSON, syntax, no outputs, no local paths)
        run: python analytics/tools/validate_notebooks.py

      - name: Install test dependencies
        run: pip install -r analytics/requirements-dev.txt

      - name: Unit tests (synthetic fixtures, no workbook required)
        run: python -m pytest analytics/tests -q
